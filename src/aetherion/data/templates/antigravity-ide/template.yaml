# Per-template metadata. Schema lives in src/aetherion/data/templates/STYLE.md.

description: "Google Antigravity (Electron VS Code fork with bundled Cascade Gemini agent, native amd64/arm64) with X11 forwarding."

# Native on both architectures: Google's Artifact Registry apt repo
# publishes linux-x64 and linux-arm64 .debs and the package is
# selected for the build host's dpkg architecture at apt-install
# time. No emulation required on either side.
#
# macOS hosts (Docker Desktop / podman-machine) run the container
# inside a Linux VM. Display forwarding works via XQuartz over TCP —
# the launcher's darwin display path sets
# DISPLAY=host.docker.internal:0 and skips the Linux-only
# socket/D-Bus/GPU plumbing. The launcher auto-configures XQuartz on
# each `--display x11` (or `auto`) launch: flips
# `org.xquartz.X11 nolisten_tcp` to false, restarts XQuartz if it
# had to change the pref, and runs `xhost +`. The only manual step
# is `brew install --cask xquartz`; missing-XQuartz halts the launch
# with that hint. The antigravity wrapper picks up `/dev/dri`
# absence at runtime and adds `--use-gl=angle --use-angle=swiftshader`
# so Chromium's renderer survives the no-GPU XQuartz path.
platforms:
  - { os: linux, arch: amd64, runtime: podman }
  - { os: linux, arch: amd64, runtime: docker }
  - { os: linux, arch: arm64, runtime: podman }
  - { os: linux, arch: arm64, runtime: docker }
  - { os: darwin, arch: amd64, runtime: docker }
  - { os: darwin, arch: amd64, runtime: podman }
  - { os: darwin, arch: arm64, runtime: docker }
  - { os: darwin, arch: arm64, runtime: podman }

# Per-namespace defaults applied at `create namespace` time. The
# launcher writes these into the new namespace's config.yaml entry;
# explicit CLI values still win.
defaults:
  display: x11
  # Bare `aetherion antigravity-ide` opens Antigravity on the launch
  # directory (`.` = the mounted workdir; the launcher sets the
  # container's `-w` to your project dir, and `command:` is shlex-
  # split with no env expansion, so `.` works where `${PWD}` would
  # not). Drop to a shell with `aetherion antigravity-ide bash`
  # (positional override) or `aetherion antigravity-ide --command
  # bash` (explicit flag).
  command: antigravity .
